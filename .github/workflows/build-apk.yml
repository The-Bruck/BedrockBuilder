name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q BedrockBuilder.zip
      - name: Patch source
        run: |
          cd BedrockBuilder/app/src/main/java/com/bedrockbuilder/ui
          sed -i 's/^import androidx.compose.ui.graphics.drawscope.drawIntoCanvas$/import androidx.compose.ui.graphics.drawscope.drawIntoCanvas\nimport androidx.compose.ui.graphics.nativeCanvas/' BuildCanvas.kt
          sed -i 's/setAutoExpand(/updateAutoExpand(/g; s/setShowOutlines(/updateShowOutlines(/g; s/setEmptyAsAir(/updateEmptyAsAir(/g' EditorViewModel.kt EditorScreen.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: BedrockBuilder
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:" build.log | head -80
      - name: List APK files
        run: |
          find . -name "*.apk" -print
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockBuilder-apk
          path: "**/*.apk"
          if-no-files-found: error
