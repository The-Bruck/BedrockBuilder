name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unpack project
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z"; done
          if [ -d BedrockBuilder/app ]; then echo "PROJECT=BedrockBuilder" >> "$GITHUB_ENV"
          elif [ -d app ]; then echo "PROJECT=." >> "$GITHUB_ENV"
          else
            echo "Could not find the project (expected BedrockBuilder/app). Repository contents:"
            ls -R | head -60
            exit 1
          fi
      - name: Fetch Mojang block textures (all assets are owned by Mojang)
        continue-on-error: true
        run: |
          pip install --break-system-packages pillow || true
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Mojang/bedrock-samples.git bs
          cd bs
          git sparse-checkout set --no-cone /resource_pack/textures/blocks /resource_pack/textures/terrain_texture.json /resource_pack/blocks.json
          cd ..
          mkdir -p "$PROJECT/app/src/main/assets"
          python3 "$PROJECT/tools/make_textures.py" bs "$PROJECT/app/src/main/assets"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Show compile errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -100
          else
            echo "build.log was not created, so the Build step never ran. An earlier step failed - scroll up to the step with the red X."
          fi
      - name: List APK files
        run: |
          find . -name "*.apk" -print
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockBuilder-apk
          path: "**/*.apk"
          if-no-files-found: error
