name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q BedrockBuilder.zip
      - name: Fetch Mojang block textures (all assets are owned by Mojang)
        continue-on-error: true
        run: |
          pip install --break-system-packages pillow || true
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Mojang/bedrock-samples.git bs
          cd bs
          git sparse-checkout set --no-cone /resource_pack/textures/blocks /resource_pack/textures/terrain_texture.json /resource_pack/blocks.json
          cd ..
          mkdir -p BedrockBuilder/app/src/main/assets
          python3 BedrockBuilder/tools/make_textures.py bs BedrockBuilder/app/src/main/assets
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: BedrockBuilder
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:" build.log | head -80
      - name: List APK files
        run: |
          find . -name "*.apk" -print
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockBuilder-apk
          path: "**/*.apk"
          if-no-files-found: error
